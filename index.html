<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contagem Regressiva do Estágio</title>



<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#00498E,#1B3255);
    overflow:hidden;
}

.background{
    position:absolute;
    width:100%;
    height:100%;
}

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    animation:float 8s infinite ease-in-out;
}

.circle:nth-child(1){
    width:250px;
    height:250px;
    top:10%;
    left:5%;
}

.circle:nth-child(2){
    width:180px;
    height:180px;
    bottom:15%;
    right:8%;
    animation-delay:2s;
}

.circle:nth-child(3){
    width:120px;
    height:120px;
    top:60%;
    left:25%;
    animation-delay:4s;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-25px);}
}

.container{
    position:relative;
    z-index:2;
    width:90%;
    max-width:900px;
    text-align:center;
    padding:40px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    border-radius:30px;
    box-shadow:0 20px 40px rgba(0,0,0,.2);
    color:white;
}

h1{
    font-size:2.5rem;
    margin-bottom:10px;
}

.subtitle{
    opacity:.9;
    margin-bottom:35px;
}

.countdown{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.box{
    background:rgba(255,255,255,0.15);
    border-radius:20px;
    padding:25px 10px;
}

.number{
    font-size:3rem;
    font-weight:700;
}

.label{
    font-size:.95rem;
    opacity:.8;
}

.progress-container{
    margin-top:35px;
}

.progress-bar{
    width:100%;
    height:18px;
    background:rgba(255,255,255,.2);
    border-radius:50px;
    overflow:hidden;
}

.progress{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00f5a0,#00d9f5);
    border-radius:50px;
}

.message{
    margin-top:25px;
    font-size:1.1rem;
}

@media(max-width:700px){
    .countdown{
        grid-template-columns:repeat(2,1fr);
    }

    h1{
        font-size:2rem;
    }
}
</style>
</head>
<body>

<div class="background">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<div class="container">

    <h1> Fim do Estágio da Lívia</h1>
    <p class="subtitle">Contagem regressiva para 14 de Outubro</p>

    <div class="countdown">
        <div class="box">
            <div class="number" id="days">0</div>
            <div class="label">Dias</div>
        </div>

        <div class="box">
            <div class="number" id="hours">0</div>
            <div class="label">Horas</div>
        </div>

        <div class="box">
            <div class="number" id="minutes">0</div>
            <div class="label">Minutos</div>
        </div>

        <div class="box">
            <div class="number" id="seconds">0</div>
            <div class="label">Segundos</div>
        </div>
    </div>

    <div class="progress-container">
        <p style="margin-bottom:10px;">Progresso do estágio</p>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
    </div>

    <div class="message" id="message"></div>
</div>

<script>

// Data de término
const endDate = new Date("2026-10-14T23:59:59");

// Início aproximado para a barra de progresso
const startDate = new Date("2024-10-15");

function updateCountdown(){

    const now = new Date();
    const diff = endDate - now;

    if(diff <= 0){
        document.querySelector('.container').innerHTML = `
            <h1>🎉 PARABÉNS!</h1>
            <p style="font-size:1.5rem;margin-top:20px">
                Seu estágio chegou ao fim!
            </p>
        `;
        return;
    }

    const days = Math.floor(diff/(1000*60*60*24));
    const hours = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
    const minutes = Math.floor((diff%(1000*60*60))/(1000*60));
    const seconds = Math.floor((diff%(1000*60))/1000);

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;

    const total = endDate - startDate;
    const current = now - startDate;

    let percent = (current / total) * 100;
    percent = Math.max(0, Math.min(100, percent));

    document.getElementById("progress").style.width = percent + "%";

    document.getElementById("message").innerHTML =
        ` Falta apenas <strong>${days} dias</strong> para encerrar essa jornada!`;
}

setInterval(updateCountdown,1000);
updateCountdown();

</script>

</body>
</html>
